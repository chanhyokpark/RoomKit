name: Build Player

on:
  workflow_dispatch:
  push:
    tags:
      - 'player-v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: ubuntu-22.04
            target: ''
            bundles: appimage
          - os: windows-latest
            target: ''
            bundles: nsis

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/player/src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build player (unsigned)
        run: pnpm --filter player build:app --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: player-${{ matrix.target || runner.os }}
          path: |
            apps/player/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/player/src-tauri/target/release/bundle/nsis/*.exe
            apps/player/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-22.04

    env:
      NDK_VERSION: 27.2.12479018

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          # arm64 covers most devices; armv7 is needed for 32-bit-only phones
          # (Android Go, Galaxy A0x, some MediaTek) which otherwise refuse to
          # install with "app isn't compatible with your phone".
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/player/src-tauri
          key: android

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        # No-op once src-tauri/gen/android is committed.
        run: |
          if [ ! -d apps/player/src-tauri/gen/android ]; then
            pnpm --filter player tauri android init
          fi
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      - name: Build APK
        run: pnpm --filter player tauri android build --apk --target aarch64 --target armv7
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      - name: Sign APK
        # Stable release keystore from repo secrets — devices accept updates
        # as long as the key stays the same.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          OUT=apps/player/src-tauri/gen/android/app/build/outputs/apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          # Prefer the universal APK (all built ABIs in one file); fall back
          # to whatever single-ABI APK exists.
          UNSIGNED=$(find "$OUT/universal" -name '*-unsigned.apk' -print -quit 2>/dev/null)
          [ -n "$UNSIGNED" ] || UNSIGNED=$(find "$OUT" -name '*-unsigned.apk' -print -quit)
          echo "Signing $UNSIGNED"
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" roomkit-player.apk
          "$BUILD_TOOLS/apksigner" sign --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            roomkit-player.apk
          rm release.keystore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: player-android
          path: roomkit-player.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/player-v')
    needs: [build, build-android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.apk
          fail_on_unmatched_files: true
          draft: false
