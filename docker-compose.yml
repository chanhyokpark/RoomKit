services:
  postgres:
    image: postgres:17-alpine
    ports:
      # 5433 on the host — a local Postgres already occupies 5432
      - '5433:5432'
    environment:
      POSTGRES_USER: roomkit
      POSTGRES_PASSWORD: roomkit
      POSTGRES_DB: roomkit
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U roomkit']
      interval: 2s
      timeout: 2s
      retries: 15

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: roomkit
      MINIO_ROOT_PASSWORD: roomkit123
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 2s
      retries: 15

  createbucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 roomkit roomkit123 &&
      mc mb -p local/roomkit &&
      exit 0
      "

  # server and studio only start under the "app" profile (compose.sh enables
  # it). A plain `docker compose up` keeps booting infra only, so host dev
  # servers on 3000/5173 don't collide.
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    profiles: ['app']
    ports:
      - '${SERVER_PORT:-3000}:3000'
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://roomkit:roomkit@postgres:5432/roomkit
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me}
      ADMIN_ID: ${ADMIN_ID:-admin}
      # Default is bcrypt("roomkit") — matches local dev creds.
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-$$2b$$10$$Ha7ajwI4Ub8WWFpvmgvBhO1VsK2N4kL1AKmXoPp5n35oSI.K9RuDG}
      S3_ENDPOINT: http://minio:9000
      # Browsers/devices fetch presigned URLs via the published host port.
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: roomkit
      S3_ACCESS_KEY_ID: roomkit
      S3_SECRET_ACCESS_KEY: roomkit123
      S3_FORCE_PATH_STYLE: 'true'
      PUBLIC_SERVER_URL: ${PUBLIC_SERVER_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api').then(() => process.exit(0), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  studio:
    build:
      context: .
      dockerfile: docker/studio.Dockerfile
      args:
        # Baked into the client bundle at build time — must be the server
        # origin as reachable from the operator's browser.
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    profiles: ['app']
    ports:
      - '${STUDIO_PORT:-5173}:3000'
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
