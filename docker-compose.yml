services:
  postgres:
    image: postgres:17-alpine
    ports:
      # 5433 on the host — a local Postgres already occupies 5432
      - '5433:5432'
    environment:
      POSTGRES_USER: roomkit
      POSTGRES_PASSWORD: roomkit
      POSTGRES_DB: roomkit
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U roomkit']
      interval: 2s
      timeout: 2s
      retries: 15

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: roomkit
      MINIO_ROOT_PASSWORD: roomkit123
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 2s
      retries: 15

  createbucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 roomkit roomkit123 &&
      mc mb -p local/roomkit &&
      exit 0
      "

volumes:
  postgres-data:
  minio-data:
