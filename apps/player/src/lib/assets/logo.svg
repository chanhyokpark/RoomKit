<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>RoomKit</title>
  <defs>
    <linearGradient id="rk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#rk-bg)"/>
  <!-- isometric cube: top / left / right faces -->
  <path d="M256 96 396 176 256 256 116 176 Z" fill="#FFFFFF" opacity="0.95"/>
  <path d="M116 176 256 256 V416 L116 336 Z" fill="#FFFFFF" opacity="0.55"/>
  <path d="M396 176 256 256 V416 L396 336 Z" fill="#FFFFFF" opacity="0.8"/>
  <!-- keyhole set into the front-right face, skewed to the face plane -->
  <path d="M-12 -2.7 A28 28 0 1 1 12 -2.7 L20 52 H-20 Z"
        fill="#312E81" transform="matrix(1 -0.5714 0 1 326 296)"/>
</svg>
