apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio
  namespace: roomkit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: studio
  template:
    metadata:
      labels:
        app: studio
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: studio
          # PUBLIC_API_URL is baked into this image at build time (build.sh
          # passes https://rk.dshs.app) — rebuild to change it.
          image: ghcr.io/chanhyokpark/roomkit-studio:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: studio
  namespace: roomkit
spec:
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: studio
