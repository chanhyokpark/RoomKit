apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: roomkit
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: roomkit
spec:
  replicas: 1
  # PVC is ReadWriteOnce — never run two rustfs pods against it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      containers:
        - name: rustfs
          # Runs as uid 10001; local-path provisions the PVC dir as 0777.
          image: rustfs/rustfs:latest
          ports:
            - containerPort: 9000
          env:
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ADDRESS
              value: 0.0.0.0:9000
            # No web console in-cluster; only the S3 API is routed.
            - name: RUSTFS_CONSOLE_ENABLE
              value: 'false'
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: roomkit-secrets
                  key: S3_ACCESS_KEY_ID
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: roomkit-secrets
                  key: S3_SECRET_ACCESS_KEY
          # Idles around 350Mi and was OOM-killed at 512Mi during the bulk
          # MinIO import — keep headroom.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: roomkit
spec:
  ports:
    - port: 9000
  selector:
    app: rustfs
---
# Creates the roomkit bucket. deploy.sh deletes the completed job before each
# apply, so it re-runs (idempotently — `rclone mkdir`) on every deploy.
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-init
  namespace: roomkit
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rclone
          image: rclone/rclone
          command:
            - /bin/sh
            - -c
            - |
              until rclone mkdir s3:roomkit; do
                echo 'waiting for rustfs...'; sleep 2
              done
          env:
            - name: RCLONE_CONFIG_S3_TYPE
              value: s3
            - name: RCLONE_CONFIG_S3_PROVIDER
              value: Other
            - name: RCLONE_CONFIG_S3_ENDPOINT
              value: http://rustfs:9000
            - name: RCLONE_CONFIG_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: roomkit-secrets
                  key: S3_ACCESS_KEY_ID
            - name: RCLONE_CONFIG_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: roomkit-secrets
                  key: S3_SECRET_ACCESS_KEY
