apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: roomkit
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: roomkit
spec:
  replicas: 1
  # PVC is ReadWriteOnce — never run two minio pods against it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio
          args: ['server', '/data']
          ports:
            - containerPort: 9000
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: roomkit-secrets
                  key: S3_ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: roomkit-secrets
                  key: S3_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: roomkit
spec:
  ports:
    - port: 9000
  selector:
    app: minio
---
# Creates the roomkit bucket. deploy.sh deletes the completed job before each
# apply, so it re-runs (idempotently — `mc mb -p`) on every deploy.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: roomkit
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc
          command:
            - /bin/sh
            - -c
            - |
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo 'waiting for minio...'; sleep 2
              done
              mc mb -p local/roomkit
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: roomkit-secrets
                  key: S3_ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: roomkit-secrets
                  key: S3_SECRET_ACCESS_KEY
