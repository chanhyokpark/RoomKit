apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: roomkit
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: roomkit
spec:
  replicas: 1
  # PVC is ReadWriteOnce — never run two postgres pods against it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: roomkit
            - name: POSTGRES_DB
              value: roomkit
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: roomkit-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: ['pg_isready', '-U', 'roomkit']
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: roomkit
spec:
  ports:
    - port: 5432
  selector:
    app: postgres
