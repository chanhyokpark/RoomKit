apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: roomkit
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: roomkit-ingress
  namespace: roomkit
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: roomkit-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - rk.dshs.app
      secretName: roomkit-tls
  rules:
    - host: rk.dshs.app
      http:
        paths:
          # NestJS REST API (global prefix /api)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 3000
          # socket.io gateways (admin/device/player namespaces)
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 3000
          # Path-style presigned S3 URLs: /roomkit/<key> → minio
          - path: /roomkit
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
          # Everything else → studio (SvelteKit SSR)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: studio
                port:
                  number: 80
